[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "txs"
version = "0.3.3"
description = "Manage tmux sessions from predefined project directories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = ["typer>=0.12", "rich>=13", "textual>=8.2.8"]

[project.urls]
Homepage = "https://github.com/emrecanaltinsoy/txs-python"
Repository = "https://github.com/emrecanaltinsoy/txs-python"
Issues = "https://github.com/emrecanaltinsoy/txs-python/issues"
Changelog = "https://github.com/emrecanaltinsoy/txs-python/releases"

[project.scripts]
txs = "txs.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/txs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
