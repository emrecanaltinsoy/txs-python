name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify package version matches tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(grep '^TXS_VERSION' src/txs/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Tag ${TAG} expects version ${EXPECTED}, but pyproject.toml has ${ACTUAL}."
            echo "Bump pyproject.toml and src/txs/__init__.py before tagging."
            exit 1
          fi
          if [[ "$INIT" != "$EXPECTED" ]]; then
            echo "::error::TXS_VERSION (${INIT}) does not match tag (${EXPECTED})."
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Generate release notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            RANGE="$TAG"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"%s" --no-merges 2>/dev/null || true)

          BREAKING_NOTES=""
          FEAT_NOTES=""
          FIX_NOTES=""
          OTHER_NOTES=""

          if [[ -n "$COMMITS" ]]; then
            while IFS= read -r msg; do
              [[ "$msg" =~ ^chore\(release\): ]] && continue
              is_breaking=false
              if [[ "$msg" =~ ^[a-z]+(\(.+\))?!: ]] || [[ "$msg" == *"BREAKING CHANGE"* ]]; then
                BREAKING_NOTES+="- ${msg}"$'\n'
                is_breaking=true
              fi
              if ! $is_breaking; then
                if [[ "$msg" =~ ^feat(\(.+\))?!?:\ (.+) ]]; then
                  FEAT_NOTES+="- ${BASH_REMATCH[2]}"$'\n'
                elif [[ "$msg" =~ ^fix(\(.+\))?!?:\ (.+) ]]; then
                  FIX_NOTES+="- ${BASH_REMATCH[2]}"$'\n'
                elif [[ "$msg" =~ ^[a-z]+(\(.+\))?:\ (.+) ]]; then
                  OTHER_NOTES+="- ${BASH_REMATCH[2]}"$'\n'
                fi
              fi
            done <<< "$COMMITS"
          fi

          NOTES=""
          [[ -n "$BREAKING_NOTES" ]] && NOTES+="## Breaking Changes"$'\n'"${BREAKING_NOTES}"$'\n'
          [[ -n "$FEAT_NOTES" ]]     && NOTES+="## Features"$'\n'"${FEAT_NOTES}"$'\n'
          [[ -n "$FIX_NOTES" ]]      && NOTES+="## Bug Fixes"$'\n'"${FIX_NOTES}"$'\n'
          [[ -n "$OTHER_NOTES" ]]    && NOTES+="## Other Changes"$'\n'"${OTHER_NOTES}"$'\n'

          NOTES+="## Installation"$'\n'$'\n'
          NOTES+='```sh'$'\n'
          NOTES+="uv tool install txs-python==${TAG#v}"$'\n'
          NOTES+='```'$'\n'$'\n'
          NOTES+="or"$'\n'$'\n'
          NOTES+='```sh'$'\n'
          NOTES+="pip install txs-python==${TAG#v}"$'\n'
          NOTES+='```'$'\n'

          echo "$NOTES" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          shopt -s nullglob
          assets=(dist/txs-"${VERSION}"-*.whl dist/txs-"${VERSION}".tar.gz)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No dist artifacts for txs ${VERSION}"
            ls -la dist/ 2>/dev/null || echo "(dist/ missing)"
            exit 1
          fi

          gh release create "$TAG" \
            --title "txs ${TAG}" \
            --notes-file release-notes.md \
            "${assets[@]}"
